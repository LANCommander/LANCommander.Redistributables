# The entire option schema for REDIST_NAME, written by hand.
#
# A runtime installer has no configuration file, so ConfigPaths is empty and there
# is nothing generated to curate. The single entry below declares a Type, which is
# what makes Merge-SchemaOverlay materialise it as an option in its own right
# rather than reporting it as stale curation.
#
# There is no CommandTemplate and no GuestPlatforms. Those belong to compatibility
# shims that wrap a game's launch command; this package installs a system runtime
# and then gets out of the way.
#
# Default is quoted. OptionDefinition.Default is typed object and
# GetDefaultAsString() calls ToString(), so an unquoted scalar reaches the install
# scripts as whatever .NET stringifies it to.

Options:
  Architecture:
    Type: choice
    DisplayName: Architecture
    Description: >
      Which runtime to install. Leave this at Both unless you have a reason not to:
      64-bit Windows needs the x86 runtime as well, because most games of this era
      are 32-bit, and a 64-bit machine with only the x64 runtime still fails to
      launch them. Match the game executable reads the executable's PE header and
      installs only the runtime it needs, which suits a curated library where the
      saving is worth the assumption -- but note that a .NET AnyCPU executable
      reports as 32-bit there even though it runs 64-bit, so set those to Both.
    Default: 'both'
    Choices:
      - { Value: 'both', DisplayName: 'Both (x86 and x64)' }
      - { Value: 'auto', DisplayName: 'Match the game executable' }
      - { Value: 'x86', DisplayName: '32-bit only (x86)' }
      - { Value: 'x64', DisplayName: '64-bit only (x64)' }
