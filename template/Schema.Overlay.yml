# Hand-written curation layered over the generated option schema.
#
# The generated half is disposable and rebuilt from the upstream config on every
# run; this file is the durable half. Nothing here is ever overwritten by a
# rebuild, so descriptions and choice lists survive upstream reshuffling. There is
# no three-way merge and nothing to resolve.
#
# Options the upstream config gains that are not mentioned here still ship -- they
# just ship uncurated, and the upstream-update pull request lists them so someone
# can describe them later.
#
# Delete this file entirely for a redistributable with no configurable options.

# Root schema properties. Only for compatibility shims -- tools that wrap game
# execution. Omit all three for a plain runtime installer.
#
# CommandTemplate: umu-run {exe} {args}
# GuestPlatforms: Windows
# DisplayName: Proton

# Regroup generated dot-paths under friendlier parents.
#
# Note that moving an option changes its dot-path, and per-game option values are
# stored keyed by that path. Regrouping an option that servers have already
# configured orphans those stored values, so settle the grouping early.
#
# Groups:
#   Rendering:
#     Description: Renderer configuration
#     Include:
#       - General.OutputAPI
#       - DirectX.Antialiasing*

# Per-option curation, keyed by the generated dot-path. Anything set here wins
# over what the parser inferred.
#
# An entry that declares a Type is authored outright rather than curated, so it
# becomes an option even when nothing generated it. That is how a shim with no
# config file to parse owns its whole schema -- see LANCommander.Redistributables
# .UmuLauncher, which is configured purely through environment variables. An entry
# without a Type is still curation and is still reported as stale when it matches
# nothing, so a mistyped path is caught rather than silently becoming an option.
#
# Options:
#   General.OutputAPI:
#     DisplayName: Output API
#     Description: Direct3D backend used to present frames.
#   PROTONPATH:
#     Type: string
#     IsEnvironmentVariable: true
#     Type: choice
#     Choices: [best, fast, accurate]
#   General.Adapter:
#     PinDefault: true          # hold the committed default against upstream changes
#   Proton.PROTONPATH:
#     IsEnvironmentVariable: true

# Drop options entirely. Glob-matched against the dot-path.
#
# Exclude:
#   - Debug.*
