name: Module Tests

# The hub's own CI. Every redistributable build depends on this module, so a
# regression here breaks the whole library.

on:
  push:
    branches: [main]
    paths:
      - 'module/**'
      - 'tests/**'
      - 'policy/**'
      - '.github/workflows/module-tests.yml'
  pull_request:
    paths:
      - 'module/**'
      - 'tests/**'
      - 'policy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Redistributable payloads are frequently Windows-only, and builds may run
        # on either, so the module has to behave identically on both.
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout LANCommander SDK Sources
        uses: actions/checkout@v4
        with:
          repository: LANCommander/LANCommander
          path: .lancommander
          # Only the SDK model sources are needed, and the repository is large.
          sparse-checkout: LANCommander.SDK
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Tests
        shell: pwsh
        env:
          # Lets the strict round-trip compile the real model sources without
          # reaching out to raw.githubusercontent.
          LANCOMMANDER_SDK_PATH: ${{ github.workspace }}/.lancommander/LANCommander.SDK
        run: |
          Import-Module Pester -MinimumVersion 5.5.0

          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './testresults.xml'

          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresults-${{ matrix.os }}
          path: testresults.xml
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

          $results = Invoke-ScriptAnalyzer -Path ./module -Recurse -Severity Error, Warning -ExcludeRule PSUseShouldProcessForStateChangingFunctions

          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)"
          }
